<script>
/* Keep navigation and language switching at the repository root.
   - 왼쪽 메뉴는 지금 언어(ko/en)의 같은 페이지로 연결한다.
   - KO/EN 전환은 같은 상대 경로의 반대 언어 페이지로 보낸다.
     대응 페이지가 없는 경로(NO_COUNTERPART)는 그 언어의 목록 페이지로 보낸다.
     그 밖의 경우에도 대상 페이지가 없으면(HEAD 404) 그 언어의 홈으로 보낸다. */
document.addEventListener("DOMContentLoaded", function () {
  try {
    var meta = document.querySelector('meta[name="quarto:offset"]');
    var root = new URL(meta ? meta.content : "./", location.href).pathname;
    if (root.slice(-1) !== "/") root += "/";
    var rel = location.pathname.slice(root.length);
    if (rel === "" || rel.slice(-1) === "/") rel += "index.html";
    var isKo = rel.indexOf("ko/") === 0;
    var isEn = rel.indexOf("en/") === 0;
    var page = (isKo || isEn) ? rel.slice(3) : rel;
    if (!isKo && !isEn) page = "index.html";

    // 한쪽 언어에만 있는 경로 접두어 → 반대 언어에서 보낼 페이지
    var NO_COUNTERPART = {
      en: { "subjects/": "subjects.html" },
      ko: {}
    };
    function target(lang) {
      var map = NO_COUNTERPART[lang];
      for (var prefix in map) {
        if (Object.prototype.hasOwnProperty.call(map, prefix) && page.indexOf(prefix) === 0) {
          return root + lang + "/" + map[prefix];
        }
      }
      return root + lang + "/" + page;
    }

    var leftNav = {
      "Home": "index",
      "Subjects": "subjects",
      "Reports": "report",
      "Projects": "projects",
      "About": "experience"
    };
    document.querySelectorAll(".navbar a[href]").forEach(function (a) {
      var label = a.textContent.trim();
      if (label === "KO" || label === "EN") {
        var lang = label === "KO" ? "ko" : "en";
        a.href = target(lang) + location.hash;
        if ((lang === "ko" && isKo) || (lang === "en" && isEn)) a.classList.add("active");
        a.addEventListener("click", function (ev) {
          if (!window.fetch) return;
          ev.preventDefault();
          var href = a.href;
          fetch(href, { method: "HEAD" }).then(function (r) {
            location.href = r.ok ? href : root + lang + "/index.html";
          }).catch(function () { location.href = href; });
        });
        return;
      }
      if (Object.prototype.hasOwnProperty.call(leftNav, label)) {
        a.href = root + (isEn ? "en/" : "ko/") + leftNav[label] + ".html";
      }
    });
  } catch (e) {}
});
</script>
