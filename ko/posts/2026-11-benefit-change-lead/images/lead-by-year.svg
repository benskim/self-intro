<text x="20.0" y="260.0" font-size="11" fill="#5A6B64" text-anchor="start" font-weight="400">2024년은 두 달(2024-03, 2024-07)의 비고 예고가 거의 전부다. 비고 예고는 대부분 시행 정확히 한 달 전에 실렸다.</text>
