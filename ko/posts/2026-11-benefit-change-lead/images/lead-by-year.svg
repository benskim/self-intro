<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 268" role="img" aria-label="인하를 한 달 이상 미리 볼 수 있었던 해는 2024년뿐이다" font-family="Pretendard, 'Noto Sans CJK KR', 'Apple SD Gothic Neo', sans-serif">
<rect width="760" height="268" fill="#ffffff"/>
<text x="20.0" y="28.0" font-size="17" fill="#14231E" text-anchor="start" font-weight="700">인하를 한 달 이상 미리 볼 수 있었던 해는 2024년뿐이다</text><text x="20.0" y="50.0" font-size="13" fill="#5A6B64" text-anchor="start" font-weight="400">급여목록만 볼 때, 연도별 인하 중 시행 1개월 이상 전에 목록에 보인 비율</text>
<text x="20.0" y="91.0" font-size="13" fill="#14231E" text-anchor="start" font-weight="400">2022</text>
